<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF->
    <meta name="color-scheme" content="light dark">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" href="data:,">
    <title>Hyperbeam Troubleshooting Example</title>
    <style>
#logs {
  position: absolute;
  top: 8px;
  right: 8px;
  opacity: 0.8;
  width: 250px;
  height: 250px;
  direction: rtl;
  text-align: left;
}
#hb-container {
  min-width: 300px;
  min-height: 300px;
  width: fit-content;
}
    </style>
  </head>
  <body>
    <div style="font-family: sans-serif">
      <button id="reconnect-btn">Reconnect</button>
    </div>
    <div id="hb-container"></div>
    <textarea readonly id="logs"></textarea>
    <script type="module">
import Hyperbeam from "https://unpkg.com/@hyperbeam/web@latest/dist/index.js";
const container = document.getElementById("hb-container");
const reconnectBtn = document.getElementById("reconnect-btn");
const logs = document.getElementById("logs");

const resp = await fetch(
  `/hb?dark=${+matchMedia("(prefers-color-scheme:dark)").matches}`
);
const data = await resp.json();
const hb = await Hyperbeam(container, data.embed_url, {
  onConnectionStateChange({ state }) {
    logs.value += `CONNECTION STATE: ${state}\n`;
    logs.scrollTop = logs.scrollHeight;
  },
});
reconnectBtn.addEventListener("click", () => {
  hb.reconnect();
});
    </script>
  </body>
</html>
